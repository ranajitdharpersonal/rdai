[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "rdai"
version = "1.0.1"
description = "One interface for resilient, multi-provider AI generation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Ranajit Dhar", email = "contact@ranajitdhar.in" },
]
keywords = [
  "ai", "llm", "cli", "failover", "gemini", "groq", "openai",
  "orchestrator", "multi-agent", "generative-ai", "claude", 
  "vertex-ai", "ai-router", "load-balancing"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "google-genai>=1.0.0",
  "groq>=0.11.0",
  "openai>=1.54.0",
  "python-dotenv>=1.0.1",
  "PyYAML>=6.0.2",
  "questionary>=2.0.1",
  "rich>=13.9.0",
  "typer>=0.12.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.8.0",
]

[project.scripts]
rdai = "rdai.cli.main:app"

[project.urls]
Homepage = "https://ranajitdhar.in"
Repository = "https://github.com/ranajitdharpersonal/rdai"
Issues = "https://github.com/ranajitdharpersonal/rdai/issues"

[tool.hatch.build.targets.wheel]
packages = ["rdai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]